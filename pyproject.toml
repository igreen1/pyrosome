[project]
name = "pyrosome"
version = "0.1.12"
description = "Versioned, append-only storage for polars data frames, safe for concurrent processes"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
    { name = "ian", email = "dev@iangreen.dev" }
]
requires-python = ">=3.14"
dependencies = [
    "polars>=2.0.0",
]

[project.urls]
Documentation = "https://iangreen.dev/pyrosome/"
Repository = "https://github.com/igreen1/pyrosome"
Issues = "https://github.com/igreen1/pyrosome/issues"

[project.optional-dependencies]
pandas = [
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pandas>=3.1.0",
    "pandas-stubs>=3.0.5.260914",
    "pyarrow>=26.0.0",
    "pylint>=4.1.3",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "ty>=0.0.91",
]
docs = [
    "furo>=2025.12.19",
    "sphinx>=9.2.0",
]

[tool.ruff]
target-version = "py314"
preview = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # conflicts with `ruff format`
    "missing-trailing-comma",
    # no copyright headers in this project
    "missing-copyright-notice",
    # every docstring documents its returns and raises, including None and
    # exceptions raised by functions it calls
    "docstring-extraneous-returns",
    "docstring-extraneous-exception",
]

[tool.ruff.lint.per-file-ignores]
# pytest relies on bare asserts
"tests/**" = ["assert"]
# Sphinx requires conf.py to sit in docs/ without an __init__.py
"docs/conf.py" = ["implicit-namespace-package"]
# standalone scripts included in the docs, which print their results
"docs/examples/**" = ["implicit-namespace-package", "print"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ty.rules]
all = "error"

[tool.ty.terminal]
error-on-warning = true

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
local_partial_types = true
strict_bytes = true
disallow_any_unimported = true
disallow_any_expr = true
disallow_any_decorated = true
disallow_any_explicit = true
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "explicit-override",
    "ignore-without-code",
    "mutable-override",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "unimported-reveal",
    "unused-awaitable",
    "unused-ignore",
]

[tool.pylint.main]
py-version = "3.14"
fail-on = ["all"]
load-plugins = [
    "pylint.extensions.bad_builtin",
    "pylint.extensions.broad_try_clause",
    "pylint.extensions.check_elif",
    "pylint.extensions.code_style",
    "pylint.extensions.comparison_placement",
    "pylint.extensions.confusing_elif",
    "pylint.extensions.consider_refactoring_into_while_condition",
    "pylint.extensions.consider_ternary_expression",
    "pylint.extensions.dict_init_mutate",
    "pylint.extensions.docparams",
    "pylint.extensions.docstyle",
    "pylint.extensions.dunder",
    "pylint.extensions.empty_comment",
    "pylint.extensions.eq_without_hash",
    "pylint.extensions.for_any_all",
    "pylint.extensions.magic_value",
    "pylint.extensions.mccabe",
    "pylint.extensions.no_self_use",
    "pylint.extensions.overlapping_exceptions",
    "pylint.extensions.private_import",
    "pylint.extensions.redefined_loop_name",
    "pylint.extensions.redefined_variable_type",
    "pylint.extensions.set_membership",
    "pylint.extensions.typing",
    "pylint.extensions.while_used",
]

[tool.pylint."messages control"]
enable = ["all"]
# every docstring documents its returns, including None
disable = ["redundant-returns-doc"]

[tool.pylint.parameter_documentation]
accept-no-param-doc = false
accept-no-raise-doc = false
accept-no-return-doc = false
accept-no-yields-doc = false
default-docstring-type = "google"

[tool.pylint.typing]
runtime-typing = false

[tool.pytest]
testpaths = ["tests", "src", "docs", "README.md"]
# run the examples in docstrings, docs pages and the README as doctests
addopts = ["--doctest-modules", "--doctest-glob=*.rst", "--doctest-glob=*.md"]
doctest_optionflags = ["ELLIPSIS"]
# defined in conftest.py
usefixtures = ["run_in_tmp_path"]
